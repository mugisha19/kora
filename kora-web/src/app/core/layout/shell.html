<a class="skip-link" href="#main" (click)="skipToMain($event)">{{
  'app.skipToContent' | transloco
}}</a>

<mat-toolbar class="toolbar no-print">
  @if (isHandset()) {
    <button
      mat-icon-button
      type="button"
      aria-controls="kora-sidenav"
      [attr.aria-expanded]="sidenav.opened"
      [attr.aria-label]="'nav.openMenu' | transloco"
      (click)="sidenav.toggle()"
    >
      <mat-icon svgIcon="menu" aria-hidden="true" />
    </button>
  }
  <a class="brand" routerLink="/dashboard" [attr.aria-label]="'app.home' | transloco">
    <span class="logo" aria-hidden="true">K</span>
    <span class="brand-name">Kora</span>
  </a>
  <span class="spacer"></span>
  <kora-notifications-button />
  <kora-approvals-button />
  <kora-org-switcher />
  <kora-language-menu />
  <kora-theme-menu />
  <kora-user-menu />
  @if (loading.active()) {
    <mat-progress-bar
      class="loading-bar"
      mode="indeterminate"
      [attr.aria-label]="'common.loadingBar' | transloco"
    />
  }
</mat-toolbar>

@if (live.offline()) {
  <div class="offline no-print" role="status">
    <mat-icon svgIcon="wifi_off" aria-hidden="true" />
    {{ 'live.offline' | transloco }}
  </div>
}

<mat-sidenav-container class="container">
  <mat-sidenav
    #sidenav
    id="kora-sidenav"
    class="sidenav no-print"
    [mode]="isHandset() ? 'over' : 'side'"
    [opened]="!isHandset()"
  >
    <nav [attr.aria-label]="'nav.label' | transloco">
      <mat-nav-list>
        @for (item of navItems(); track item.path) {
          <a
            mat-list-item
            [routerLink]="item.path"
            routerLinkActive
            #link="routerLinkActive"
            ariaCurrentWhenActive="page"
            [activated]="link.isActive"
          >
            <mat-icon matListItemIcon [svgIcon]="item.icon" aria-hidden="true" />
            <span matListItemTitle>{{ item.label | transloco }}</span>
          </a>
        }
      </mat-nav-list>
    </nav>
  </mat-sidenav>

  <mat-sidenav-content>
    <main #main id="main" class="main" tabindex="-1">
      <router-outlet />
    </main>
  </mat-sidenav-content>
</mat-sidenav-container>
