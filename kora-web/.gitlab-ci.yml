# GitLab pipeline for the Angular web app, included from the root .gitlab-ci.yml.
# Mirrors .github/workflows/web-ci.yml so both platforms show the same checks.

.web-rules:
  rules:
    - if: $CI_COMMIT_TAG =~ /^(web-)?v/
    - changes:
        - kora-web/**/*
        - .gitlab-ci.yml

.web-node:
  image: node:24-bookworm
  before_script:
    - cd kora-web
    - npm ci --cache .npm --prefer-offline
  cache:
    key:
      files:
        - kora-web/package-lock.json
    paths:
      - kora-web/.npm/

web:quality:
  stage: test
  extends: [.web-node, .web-rules]
  script:
    - npm run format:check
    - npm run lint
    - npm run test:ci
    - npm run build
  coverage: '/Lines\s*:\s*(\d+(?:\.\d+)?)%/'
  artifacts:
    when: always
    expire_in: 7 days
    paths:
      - kora-web/coverage/

web:e2e:
  stage: e2e
  extends: [.web-rules]
  # Official Playwright image already contains the browsers and their system libraries.
  image: mcr.microsoft.com/playwright:v1.63.0-noble
  needs: ['web:quality']
  variables:
    CI: 'true'
  script:
    - cd kora-web
    - npm ci --cache .npm --prefer-offline
    - npm run e2e
  artifacts:
    when: on_failure
    expire_in: 7 days
    paths:
      - kora-web/playwright-report/
