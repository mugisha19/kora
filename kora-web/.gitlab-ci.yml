# GitLab pipeline for the Angular web app, included from the root .gitlab-ci.yml.
# Mirrors .github/workflows/web-ci.yml so both platforms show the same checks.

.web-rules:
  rules:
    - if: $CI_COMMIT_TAG =~ /^(web-)?v/
    - changes:
        - kora-web/**/*
        - kora-api/docs/openapi.yaml
        - .gitlab-ci.yml

.web-node:
  image: node:24-bookworm
  before_script:
    - cd kora-web
    - npm ci --cache .npm --prefer-offline
  cache:
    key:
      files:
        - kora-web/package-lock.json
    paths:
      - kora-web/.npm/

web:quality:
  stage: test
  extends: [.web-node, .web-rules]
  script:
    - npm run format:check
    - npm run lint
    - npm run api:check
    - npm run test:ci
    - npm run build
  coverage: '/Lines\s*:\s*(\d+(?:\.\d+)?)%/'
  artifacts:
    when: always
    expire_in: 7 days
    paths:
      - kora-web/coverage/

web:e2e:
  stage: e2e
  extends: [.web-rules]
  # Official Playwright image already contains the browsers and their system libraries.
  image: mcr.microsoft.com/playwright:v1.63.0-noble
  needs: ['web:quality']
  variables:
    CI: 'true'
  script:
    - cd kora-web
    - npm ci --cache .npm --prefer-offline
    - npm run e2e
  artifacts:
    when: on_failure
    expire_in: 7 days
    paths:
      - kora-web/playwright-report/

# The Nginx image (Phase 10): built after the checks pass, smoke-checked, then scanned like on GitHub.
web:image:
  stage: image
  extends: [.web-rules]
  needs: ['web:quality']
  image: docker:cli
  services:
    - name: docker:dind
      alias: docker
  variables:
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ''
  script:
    - docker build -t kora-web:$CI_COMMIT_SHORT_SHA kora-web
    # The container starts and answers its health check (dind publishes its ports on the `docker` host).
    - docker run -d --name web -p 8080:8080 kora-web:$CI_COMMIT_SHORT_SHA
    - for i in $(seq 1 20); do wget -qO- http://docker:8080/healthz && break; sleep 1; done
    - wget -qO- http://docker:8080/healthz
    - docker save kora-web:$CI_COMMIT_SHORT_SHA -o kora-web-image.tar
  artifacts:
    expire_in: 1 day
    paths:
      - kora-web-image.tar

web:image-scan:
  stage: image
  extends: [.web-rules]
  needs: ['web:image']
  image:
    name: aquasec/trivy:0.74.0
    entrypoint: ['']
  script:
    - trivy image --input kora-web-image.tar --scanners vuln --timeout 20m --severity CRITICAL --ignore-unfixed
      --exit-code 1 --no-progress
