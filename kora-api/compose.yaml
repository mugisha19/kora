# Local development services. `./mvnw spring-boot:run` starts them automatically (spring-boot-docker-compose)
# and points the app at them; `docker compose up -d` starts them by hand.
services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: kora
      POSTGRES_USER: kora
      # Local-only credentials for a throwaway container; never used outside development.
      POSTGRES_PASSWORD: kora
    ports:
      # 5433 on the host so it doesn't clash with a locally installed PostgreSQL on 5432.
      - '127.0.0.1:5433:5432'
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U kora -d kora']
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    # Refresh-token families and rate-limit buckets.
    image: redis:8-alpine
    ports:
      - '127.0.0.1:6379:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

  mailpit:
    # Catches every outgoing email locally; read them at http://localhost:8025.
    image: axllent/mailpit:v1.31
    ports:
      - '127.0.0.1:1025:1025'
      - '127.0.0.1:8025:8025'

  seaweedfs:
    # S3-compatible storage for attachments (MinIO no longer publishes images). The API creates the bucket.
    image: chrislusf/seaweedfs:4.47
    command: ['server', '-s3', '-s3.config=/etc/seaweedfs/s3.json', '-dir=/data']
    ports:
      - '127.0.0.1:8333:8333'
    volumes:
      - ./config/seaweedfs-s3.json:/etc/seaweedfs/s3.json:ro
      - seaweedfs-data:/data

  api:
    # The API itself, built from this folder, for a stack that runs without a JDK:
    #   docker compose --profile demo up --build
    # With the demo profile it creates the demo organizations on first start (feature 22); sign in on port 8080.
    # The web app's Nginx proxies /api and /ws to this service by its name, `api`.
    profiles: ['demo']
    build: .
    image: kora-api:local
    environment:
      SPRING_PROFILES_ACTIVE: demo
      SPRING_DOCKER_COMPOSE_ENABLED: 'false'
      # Local-only credentials of the containers above.
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/kora
      SPRING_DATASOURCE_USERNAME: kora
      SPRING_DATASOURCE_PASSWORD: kora
      SPRING_DATA_REDIS_HOST: redis
      SPRING_MAIL_HOST: mailpit
      SPRING_MAIL_PORT: '1025'
      KORA_STORAGE_ENDPOINT: http://seaweedfs:8333
      # Browsers upload and download through the port published on the host.
      KORA_STORAGE_PUBLIC_ENDPOINT: http://localhost:8333
      KORA_WEB_BASE_URL: http://localhost:4200
    ports:
      - '127.0.0.1:8080:8080'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      seaweedfs:
        condition: service_started
      mailpit:
        condition: service_started

volumes:
  postgres-data:
  seaweedfs-data:
