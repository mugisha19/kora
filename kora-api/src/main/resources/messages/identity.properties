# Identity emails, English (default). {0} name, {1} link, {2} minutes the link stays valid.
identity.password-reset.subject=Reset your Kora password
identity.password-reset.body=Hello {0},\n\nSomeone asked to reset the password of your Kora account. If it was you, choose a new password here:\n\n{1}\n\nThe link works once and expires in {2} minutes. If you didn''t ask for this, ignore this email: your password stays the same.\n\nKora
