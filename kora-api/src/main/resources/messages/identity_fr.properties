identity.password-reset.subject=Réinitialisez votre mot de passe Kora
identity.password-reset.body=Bonjour {0},\n\nUne réinitialisation du mot de passe de votre compte Kora a été demandée. Si c''est vous, choisissez un nouveau mot de passe ici :\n\n{1}\n\nLe lien ne fonctionne qu''une fois et expire dans {2} minutes. Si vous n''avez rien demandé, ignorez ce message : votre mot de passe ne change pas.\n\nKora
