# Defaults shared by every environment. Secrets and connection details come from environment variables
# (SPRING_DATASOURCE_URL, ...) in deployed environments, and from compose.yaml when running locally.
spring:
  application:
    name: kora-api
  threads:
    virtual:
      # Request handling on virtual threads: blocking JDBC calls stop pinning platform threads.
      enabled: true
  jpa:
    # No lazy loading during view rendering: every query happens inside a use case (no hidden N+1).
    open-in-view: false
    hibernate:
      # Flyway owns the schema; Hibernate only checks that the mappings match it.
      ddl-auto: validate
  flyway:
    locations: classpath:db/migration
  jackson:
    # Absent optional fields are omitted rather than sent as null (matches the contract's optional properties).
    default-property-inclusion: non_null
  data:
    web:
      pageable:
        # Contract paging: 0-based `page`, `size` 20 by default and capped at 100 (ADR 0005).
        default-page-size: 20
        max-page-size: 100
  messages:
    # Email texts per module, in English (default), French and Kinyarwanda.
    basename: messages/identity,messages/organization
    fallback-to-system-locale: false
  mail:
    # Mailpit from compose.yaml locally (web UI on http://localhost:8025); a real SMTP relay elsewhere.
    host: localhost
    port: 1025
  docker:
    compose:
      # `spring-boot:run` starts the services in compose.yaml and wires their connection details.
      lifecycle-management: start-only

server:
  port: 8080

logging:
  pattern:
    # Human-readable local logs still show which request a line belongs to.
    level: '%5p [%X{correlationId:-}]'

management:
  endpoints:
    web:
      exposure:
        include: health, info, prometheus
  health:
    mail:
      # Email is best-effort and sent asynchronously; an SMTP outage must not take the API out of the load balancer.
      enabled: false
  endpoint:
    health:
      # /actuator/health/liveness and /readiness for container orchestrators.
      probes:
        enabled: true
  info:
    java:
      enabled: true

kora:
  web:
    # Links in emails (password reset, invitations) point at the web app.
    base-url: http://localhost:4200
  mail:
    from: 'Kora <no-reply@kora.local>'
  identity:
    jwt:
      issuer: kora
      access-token-lifetime: 15m
      # Set KORA_IDENTITY_JWT_KEY_ID, _PRIVATE_KEY and _PUBLIC_KEY outside development (see README).
      allow-ephemeral-key: true
    refresh-token:
      lifetime: 14d
      family-lifetime: 30d
      reuse-grace-period: 10s
      cookie-secure: true
