      properties:
        country:
          type: string
          enum: [RW]
        year:
          type: integer
          format: int32
          minimum: 2000
          maximum: 2100

    # ---------- Earned value ----------
    PercentCompleteMethod:
      type: string
      description: |
        How much of a work package's budget is earned. PHYSICAL: its percent complete (from tasks or reported);
        ZERO_HUNDRED: nothing until complete; FIFTY_FIFTY: half once started, all when complete; STORY_POINTS:
        the project's budget in proportion to finished story points.
      enum: [PHYSICAL, ZERO_HUNDRED, FIFTY_FIFTY, STORY_POINTS]
    EacMethod:
      type: string
      description: |
        TYPICAL: BAC ÷ CPI (today's cost efficiency continues); ATYPICAL: AC + (BAC − EV) (the rest goes to plan);
        COMPOSITE: AC + (BAC − EV) ÷ (CPI × SPI) (cost and schedule pressure both continue).
      enum: [TYPICAL, ATYPICAL, COMPOSITE]
    EvmSettings:
      type: object
      required: [percentCompleteMethod, eacMethod, version]
      properties:
        percentCompleteMethod:
          $ref: '#/components/schemas/PercentCompleteMethod'
        eacMethod:
          $ref: '#/components/schemas/EacMethod'
        version:
          type: integer
          format: int64
          description: 0 until changed
    UpdateEvmSettingsRequest:
      type: object
      required: [percentCompleteMethod, eacMethod]
      properties:
        percentCompleteMethod:
          $ref: '#/components/schemas/PercentCompleteMethod'
        eacMethod:
          $ref: '#/components/schemas/EacMethod'
    EvmUnavailable:
      type: object
      required: [metric, reason]
      properties:
        metric:
          type: string
          example: cpi
        reason:
          type: string
          example: No actual cost yet
    EvmReport:
      type: object
      required: [projectId, asOf, percentCompleteMethod, eacMethod, unratedHours, unavailable]
      properties:
        projectId:
          type: string
          format: uuid
        asOf:
          type: string
          format: date
        percentCompleteMethod:
          $ref: '#/components/schemas/PercentCompleteMethod'
        eacMethod:
          $ref: '#/components/schemas/EacMethod'
        bac:
          allOf:
            - $ref: '#/components/schemas/Money'
          description: 'Budget at completion: the planned cost of the whole WBS'
        pv:
          allOf:
            - $ref: '#/components/schemas/Money'
          description: 'Planned value: the planned cost of the work scheduled up to today'
        ev:
          allOf:
            - $ref: '#/components/schemas/Money'
          description: 'Earned value: the planned cost of the work done'
        ac:
          allOf:
            - $ref: '#/components/schemas/Money'
          description: 'Actual cost: approved hours × cost rates'
        sv:
          allOf:
            - $ref: '#/components/schemas/Money'
          description: 'Schedule variance EV − PV; negative is behind'
        cv:
          allOf:
            - $ref: '#/components/schemas/Money'
          description: 'Cost variance EV − AC; negative is over budget'
        spi:
          type: number
          description: EV ÷ PV; below 1 is behind schedule
        cpi:
          type: number
          description: EV ÷ AC; below 1 is over budget
        eac:
          allOf:
            - $ref: '#/components/schemas/Money'
          description: 'Estimate at completion, by `eacMethod`'
        etc:
          allOf:
            - $ref: '#/components/schemas/Money'
          description: 'Estimate to complete: EAC − AC'
        vac:
          allOf:
            - $ref: '#/components/schemas/Money'
          description: 'Variance at completion: BAC − EAC'
        tcpi:
          type: number
          description: '(BAC − EV) ÷ (BAC − AC): the efficiency needed to finish on budget'
        unratedHours:
          type: number
          description: Approved hours without a cost rate for their day; they cost nothing in AC
        unavailable:
          type: array
          items:
            $ref: '#/components/schemas/EvmUnavailable'
    EvmPoint:
      type: object
      required: [weekEnding, pv]
      properties:
        weekEnding:
          type: string
          format: date
        pv:
          $ref: '#/components/schemas/Money'
        ev:
          $ref: '#/components/schemas/Money'
        ac:
          $ref: '#/components/schemas/Money'
    EvmSeries:
      type: object
      required: [projectId, points]
      properties:
        projectId:
          type: string
          format: uuid
        bac:
          $ref: '#/components/schemas/Money'
        points:
          type: array
          items:
            $ref: '#/components/schemas/EvmPoint'
    DashboardTrendMonth:
      type: object
      required: [month, pv, ev, ac]
      properties:
        month:
          type: string
          example: 2026-09
        pv:
          $ref: '#/components/schemas/Money'
        ev:
          $ref: '#/components/schemas/Money'
        ac:
          $ref: '#/components/schemas/Money'
        spi:
          type: number
        cpi:
          type: number
    DashboardTrends:
      type: object
      required: [months]
      properties:
        months:
          type: array
          items:
            $ref: '#/components/schemas/DashboardTrendMonth'

    # ---------- Notifications (0.7.0) ----------
    NotificationType:
      type: string
      enum: [TASK_ASSIGNED, APPROVAL_REQUESTED, CHANGE_REQUEST_DECIDED, TIMESHEET_DECIDED, RISK_REVIEW_OVERDUE,
             ISSUE_ESCALATED]
    Notification:
      type: object
      required: [id, type, titleKey, params, createdAt]
      properties:
        id:
          type: string
          format: uuid
        type:
          $ref: '#/components/schemas/NotificationType'
        titleKey:
          type: string
          description: Translation key, e.g. notifications.task_assigned
          example: notifications.task_assigned
        params:
          type: object
          additionalProperties: true
          description: Values for the translated title, e.g. key, title, actor
        link:
          type: string
          description: Web app path to open, e.g. /projects/{id}/tasks/{taskId}
        readAt:
          type: string
          format: date-time
        createdAt:
          type: string
          format: date-time
    NotificationPage:
      type: object
      required: [items, unreadCount]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Notification'
        nextCursor:
          type: string
          description: Absent on the last page
        unreadCount:
          type: integer
          format: int32
    NotificationPreference:
      type: object
      required: [type, inApp, email]
      properties:
        type:
          $ref: '#/components/schemas/NotificationType'
        inApp:
          type: boolean
        email:
          type: boolean
    NotificationPreferences:
      type: object
      required: [preferences]
      properties:
        preferences:
          type: array
          items:
            $ref: '#/components/schemas/NotificationPreference'

    # ---------- Activity and audit ----------
    ActivityEntry:
      type: object
      required: [id, occurredAt, action, entityType, entityId, changedFields]
      properties:
        id:
          type: string
          format: uuid
        occurredAt:
          type: string
          format: date-time
        actor:
          $ref: '#/components/schemas/UserRef'
        action:
          type: string
          example: task.updated
        entityType:
          type: string
          example: task
        entityId:
          type: string
          format: uuid
        entityLabel:
          type: string
          description: The item''s key or name when it has one
        changedFields:
          type: array
          items:
            type: string
    ActivityPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ActivityEntry'
        nextCursor:
          type: string
          description: Absent on the last page
    AuditOutcome:
      type: string
      enum: [SUCCESS, DENIED]
    FieldChange:
      type: object
      properties:
        before:
          description: Absent when the item was created; secrets are never recorded
        after:
          description: Absent when the item was deleted
    AuditEvent:
      type: object
      required: [id, occurredAt, action, entityType, outcome, changes]
      properties:
        id:
          type: string
          format: uuid
        occurredAt:
          type: string
          format: date-time
        actor:
          $ref: '#/components/schemas/UserRef'
        actorIp:
          type: string
          description: Masked (last IPv4 octet or IPv6 groups zeroed)
          example: 41.186.12.0
        userAgent:
          type: string
        correlationId:
          type: string
        action:
          type: string
          example: task.updated
        entityType:
          type: string
          example: task
        entityId:
          type: string
          format: uuid
        entityLabel:
          type: string
        projectId:
          type: string
          format: uuid
        outcome:
          $ref: '#/components/schemas/AuditOutcome'
        changes:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/FieldChange'
    AuditPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/AuditEvent'
        nextCursor:
          type: string
          description: Absent on the last page
    AuditVerification:
      type: object
      required: [valid, checked]
      properties:
        valid:
          type: boolean
        checked:
          type: integer
          format: int32
          description: Entries checked
        firstBrokenId:
          type: string
          format: uuid
          description: The first entry whose hash doesn''t match

    # ---------- Attachments ----------
    AttachmentOwnerType:
      type: string
      enum: [PROJECT, TASK, RISK, ISSUE, CHANGE_REQUEST]
    AttachmentStatus:
      type: string
      description: 'PENDING: waiting for the upload; AVAILABLE: checked and downloadable'
      enum: [PENDING, AVAILABLE]
    ScanStatus:
      type: string
      description: 'NOT_SCANNED until a malware scanner is configured; then CLEAN or INFECTED'
      enum: [NOT_SCANNED, CLEAN, INFECTED]
    Attachment:
      type: object
      required: [id, ownerType, ownerId, projectId, fileName, contentType, sizeBytes, status, scanStatus, uploadedBy, uploadedAt]
      properties:
        id:
          type: string
          format: uuid
        ownerType:
          $ref: '#/components/schemas/AttachmentOwnerType'
        ownerId:
          type: string
          format: uuid
        projectId:
          type: string
          format: uuid
        fileName:
          type: string
        contentType:
          type: string
          description: Detected from the content once complete
        sizeBytes:
          type: integer
          format: int64
        sha256:
          type: string
          description: Hex digest, once complete
        status:
          $ref: '#/components/schemas/AttachmentStatus'
        scanStatus:
          $ref: '#/components/schemas/ScanStatus'
        uploadedBy:
          $ref: '#/components/schemas/UserRef'
        uploadedAt:
          type: string
          format: date-time
    StartUploadRequest:
      type: object
      required: [ownerType, ownerId, fileName, contentType, sizeBytes]
      properties:
        ownerType:
          $ref: '#/components/schemas/AttachmentOwnerType'
        ownerId:
          type: string
          format: uuid
        fileName:
          type: string
          minLength: 1
          maxLength: 200
        contentType:
          type: string
          maxLength: 100
          example: application/pdf
        sizeBytes:
          type: integer
          format: int64
          minimum: 1
          maximum: 26214400
    AttachmentUpload:
      type: object
      required: [attachment, uploadUrl, uploadMethod, uploadHeaders, expiresAt]
      properties:
        attachment:
          $ref: '#/components/schemas/Attachment'
        uploadUrl:
          type: string
        uploadMethod:
          type: string
          enum: [PUT]
        uploadHeaders:
          type: object
          additionalProperties:
            type: string
          description: Headers the PUT must send, e.g. Content-Type
        expiresAt:
          type: string
          format: date-time
    AttachmentDownload:
      type: object
      required: [url, expiresAt]
      properties:
        url:
          type: string
        expiresAt:
          type: string
          format: date-time
