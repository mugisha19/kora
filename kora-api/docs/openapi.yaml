openapi: 3.0.3
info:
  title: Kora API
  version: 0.3.0
  description: |
    Multi-tenant project and portfolio management built on PMI practices.

    This file is the contract between `kora-api` and `kora-web` (ADR 0006). The web client is generated
    from it, and the API's responses are validated against it in tests.

    ## Conventions (ADR 0005)
    - **Tenancy:** tenant-scoped operations require `X-Organization-Id`. It is checked against the caller's
      memberships; a non-member gets `403 tenant.forbidden`. The organization is never part of the token.
    - **Errors:** RFC 9457 Problem Details (`application/problem+json`) with a stable machine-readable
      `code`, the request's `correlationId` and, for validation failures, `errors[]`. Clients translate by
      `code`; `detail` is for developers.
    - **Paging:** `page` is 0-based, `size` defaults to 20 and is capped at 100, `sort=field,asc|desc` may
      repeat. Unknown sort fields are rejected with `400 validation.failed`.
    - **Optimistic locking:** versioned resources return `ETag: "<version>"` and a `version` field. Updates
      must send `If-Match` with that value: missing → `428 concurrency.if_match_required`, stale →
      `412 concurrency.stale_version`.
    - **Correlation:** send `X-Correlation-Id` (1–64 chars of `[A-Za-z0-9-]`) or one is generated. It is
      echoed on every response and in `correlationId`.
    - **Ids** are UUIDs. An id belonging to another organization returns `404`, never `403`.
    - **Times** are ISO 8601 UTC instants; dates are ISO 8601 dates.
  license:
    name: Proprietary (portfolio project)
    url: https://github.com/mugisha19/kora

servers:
  - url: /api/v1
    description: Same origin (the web dev server proxies /api to http://localhost:8080)

tags:
  - name: Auth
    description: Sign-in, sessions and password recovery (feature 01)
  - name: Me
    description: The signed-in user's profile and memberships (features 02, 23)
  - name: Organization
    description: The active organization (feature 02)
  - name: Members
    description: People in the active organization and their roles (feature 03)
  - name: Invitations
    description: Expiring, single-use email invitations (feature 03)
  - name: Portfolios
    description: Portfolios and programs (feature 04)
  - name: Projects
    description: Projects, their lifecycle, team and health (feature 04)
  - name: Charter
    description: The project charter and its approval (feature 06)
  - name: WBS
    description: Work breakdown structure with rolled-up effort, cost and progress (feature 07)
  - name: Dashboard
    description: Portfolio dashboard read model (feature 05)
  - name: Tasks
    description: Tasks and the Kanban board (feature 08)
  - name: Sprints
    description: Backlog, sprints, burndown and velocity (feature 09)

security:
  - bearerAuth: []

paths:
  /auth/login:
    post:
      tags: [Auth]
      operationId: login
      summary: Sign in with email and password
      description: |
        Returns a short-lived access token and sets the `kora_refresh` cookie. Unknown email and wrong
        password produce the same `401 auth.invalid_credentials` with the same timing.
      security: []
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Signed in
          headers:
            Set-Cookie:
              $ref: '#/components/headers/SetRefreshCookie'
            X-Correlation-Id:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/InvalidCredentials'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'

  /auth/refresh:
    post:
      tags: [Auth]
      operationId: refreshSession
      summary: Exchange the refresh cookie for a new access token
      description: |
        Rotates the refresh token: the old one stops working and a new cookie is set. Presenting a token that
        was already rotated revokes the whole session family (theft detection).
      security:
        - refreshCookie: []
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
      responses:
        '200':
          description: Session refreshed
          headers:
            Set-Cookie:
              $ref: '#/components/headers/SetRefreshCookie'
            X-Correlation-Id:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionResponse'
        '401':
          description: 'Missing, expired, revoked or reused refresh token. Code: `auth.refresh_invalid`.'
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '500':
          $ref: '#/components/responses/InternalError'

  /auth/logout:
    post:
      tags: [Auth]
      operationId: logout
      summary: Sign out and revoke the session
      description: Revokes the refresh token family and expires the cookie. Always succeeds.
      security:
        - refreshCookie: []
        - {}
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
      responses:
        '204':
          description: Signed out
          headers:
            Set-Cookie:
              $ref: '#/components/headers/ClearRefreshCookie'
            X-Correlation-Id:
              $ref: '#/components/headers/CorrelationId'
        '500':
          $ref: '#/components/responses/InternalError'

  /auth/register-organization:
    post:
      tags: [Auth]
      operationId: registerOrganization
      summary: Create an organization and its first administrator
      description: The new user becomes `ORG_ADMIN` of the new organization and is signed in.
      security: []
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterOrganizationRequest'
      responses:
        '201':
          description: Organization created and user signed in
          headers:
            Set-Cookie:
              $ref: '#/components/headers/SetRefreshCookie'
            X-Correlation-Id:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          description: 'Email already has an account. Code: `auth.email_taken` with `errors[{field: "email"}]`.'
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'

  /auth/password/forgot:
    post:
      tags: [Auth]
      operationId: forgotPassword
      summary: Request a password reset email
      description: Always `202`, whether or not the email has an account, so accounts can't be discovered.
      security: []
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ForgotPasswordRequest'
      responses:
        '202':
          description: Accepted; an email is sent if the account exists
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/CorrelationId'
        '400':
          $ref: '#/components/responses/BadRequest'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'

  /auth/password/reset:
    post:
      tags: [Auth]
      operationId: resetPassword
      summary: Set a new password with a reset token
      description: The token is single-use. A successful reset signs the user out everywhere.
      security: []
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResetPasswordRequest'
      responses:
        '204':
          description: Password changed; all sessions revoked
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/CorrelationId'
        '400':
          $ref: '#/components/responses/BadRequest'
        '410':
          description: 'Token unknown, expired or already used. Code: `auth.reset_token_invalid`.'
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'

  /me:
    get:
      tags: [Me]
      operationId: getMe
      summary: The signed-in user with all memberships
      description: Drives the organization switcher. Not tenant-scoped.
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
      responses:
        '200':
          description: Current user
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MeResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '500':
          $ref: '#/components/responses/InternalError'
    patch:
      tags: [Me]
      operationId: updateMe
      summary: Update your name or preferred language
      description: Only the fields present are changed. No `If-Match`; a profile has a single editor.
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateMeRequest'
      responses:
        '200':
          description: Updated user
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MeResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '500':
          $ref: '#/components/responses/InternalError'

  /organization:
    get:
      tags: [Organization]
      operationId: getOrganization
      summary: The active organization
      parameters:
        - $ref: '#/components/parameters/OrganizationId'
        - $ref: '#/components/parameters/CorrelationId'
      responses:
        '200':
          description: Active organization
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
            X-Correlation-Id:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Organization'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'
    patch:
      tags: [Organization]
      operationId: updateOrganization
      summary: Change the organization's name, currency or time zone
      description: '`ORG_ADMIN` only.'
      parameters:
        - $ref: '#/components/parameters/OrganizationId'
        - $ref: '#/components/parameters/IfMatch'
        - $ref: '#/components/parameters/CorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateOrganizationRequest'
      responses:
        '200':
          description: Updated organization
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
            X-Correlation-Id:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Organization'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          description: 'Projects already have budgets in the current currency. Code: `organization.currency_locked`.'
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '412':
          $ref: '#/components/responses/PreconditionFailed'
        '428':
          $ref: '#/components/responses/PreconditionRequired'
        '500':
          $ref: '#/components/responses/InternalError'

  /members:
    get:
      tags: [Members]
      operationId: listMembers
      summary: Search the organization's members
      description: 'Sortable by `fullName`, `email`, `role`, `joinedAt`. Default sort: `fullName,asc`.'
      parameters:
        - $ref: '#/components/parameters/OrganizationId'
        - name: q
          in: query
          description: Case-insensitive match on name or email
          schema:
            type: string
            maxLength: 100
        - name: role
          in: query
          schema:
            $ref: '#/components/schemas/Role'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
        - $ref: '#/components/parameters/Sort'
        - $ref: '#/components/parameters/CorrelationId'
      responses:
        '200':
          description: One page of members
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MemberPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'

  /members/{memberId}:
    parameters:
      - $ref: '#/components/parameters/MemberId'
    patch:
      tags: [Members]
      operationId: changeMemberRole
      summary: Change a member's role
      description: '`ORG_ADMIN` only. The organization always keeps at least one `ORG_ADMIN`.'
      parameters:
        - $ref: '#/components/parameters/OrganizationId'
        - $ref: '#/components/parameters/IfMatch'
        - $ref: '#/components/parameters/CorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangeMemberRoleRequest'
      responses:
        '200':
          description: Updated member
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
            X-Correlation-Id:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Member'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: 'Would leave the organization without an administrator. Code: `members.last_admin`.'
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '412':
          $ref: '#/components/responses/PreconditionFailed'
        '428':
          $ref: '#/components/responses/PreconditionRequired'
        '500':
          $ref: '#/components/responses/InternalError'
    delete:
      tags: [Members]
      operationId: removeMember
      summary: Remove a member from the organization
      description: '`ORG_ADMIN` only. You can''t remove yourself.'
      parameters:
        - $ref: '#/components/parameters/OrganizationId'
        - $ref: '#/components/parameters/CorrelationId'
      responses:
        '204':
          description: Member removed
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/CorrelationId'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: 'Tried to remove yourself. Code: `members.self_removal`.'
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '500':
          $ref: '#/components/responses/InternalError'

  /invitations:
    get:
      tags: [Invitations]
      operationId: listInvitations
      summary: List invitations by status
      description: '`ORG_ADMIN` only. Sortable by `createdAt`, `expiresAt`, `email`. Default sort: `createdAt,desc`.'
      parameters:
        - $ref: '#/components/parameters/OrganizationId'
        - name: status
          in: query
          description: Omit for all statuses
          schema:
            $ref: '#/components/schemas/InvitationStatus'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
        - $ref: '#/components/parameters/Sort'
        - $ref: '#/components/parameters/CorrelationId'
      responses:
        '200':
          description: One page of invitations
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvitationPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      tags: [Invitations]
      operationId: createInvitation
      summary: Invite someone by email
      description: '`ORG_ADMIN` only. Sends an email with a link valid for 14 days.'
      parameters:
        - $ref: '#/components/parameters/OrganizationId'
        - $ref: '#/components/parameters/CorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateInvitationRequest'
      responses:
        '201':
          description: Invitation created and sent
          headers:
            Location:
              description: URL of the new invitation
              schema:
                type: string
            X-Correlation-Id:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Invitation'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          description: |
            `invitations.already_member` (with `errors[{field: "email"}]`) or `invitations.already_pending`.
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '500':
          $ref: '#/components/responses/InternalError'

  /invitations/{invitationId}:
    parameters:
      - $ref: '#/components/parameters/InvitationId'
    delete:
      tags: [Invitations]
      operationId: revokeInvitation
      summary: Revoke a pending invitation
      description: '`ORG_ADMIN` only.'
      parameters:
        - $ref: '#/components/parameters/OrganizationId'
        - $ref: '#/components/parameters/CorrelationId'
      responses:
        '204':
          description: Invitation revoked
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/CorrelationId'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: 'Invitation is no longer pending. Code: `invitations.not_pending`.'
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '500':
          $ref: '#/components/responses/InternalError'

  /invitations/token/{token}:
    parameters:
      - $ref: '#/components/parameters/InvitationToken'
    get:
      tags: [Invitations]
      operationId: previewInvitation
      summary: Public preview of an invitation link
      description: Shows who invited whom to what, and whether the email already has an account. Signs nobody in.
      security: []
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
      responses:
        '200':
          description: Invitation preview
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvitationPreview'
        '404':
          $ref: '#/components/responses/InvitationNotFound'
        '410':
          $ref: '#/components/responses/InvitationGone'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'

  /invitations/token/{token}/accept:
    parameters:
      - $ref: '#/components/parameters/InvitationToken'
    post:
      tags: [Invitations]
      operationId: acceptInvitation
      summary: Accept an invitation and sign in
      description: |
        New account (`existingAccount: false` in the preview): send `fullName` and a new `password`.
        Existing account: send the account's current `password` only. On success the user joins the
        organization and is signed in.
      security: []
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AcceptInvitationRequest'
      responses:
        '200':
          description: Joined the organization and signed in
          headers:
            Set-Cookie:
              $ref: '#/components/headers/SetRefreshCookie'
            X-Correlation-Id:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/InvalidCredentials'
        '404':
          $ref: '#/components/responses/InvitationNotFound'
        '410':
          $ref: '#/components/responses/InvitationGone'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'

  /portfolios:
    get:
      tags: [Portfolios]
      operationId: listPortfolios
      summary: List portfolios
      description: 'Everyone in the organization can see portfolios. Sortable by `name`, `createdAt`. Default: `name,asc`.'
      parameters:
        - $ref: '#/components/parameters/OrganizationId'
        - name: status
          in: query
          schema:
            $ref: '#/components/schemas/PortfolioStatus'
        - name: q
          in: query
          description: 'Case-insensitive match on name (and code for projects)'
          schema:
            type: string
            maxLength: 100
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
        - $ref: '#/components/parameters/Sort'
        - $ref: '#/components/parameters/CorrelationId'
      responses:
        '200':
          description: One page of portfolios
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PortfolioPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      tags: [Portfolios]
      operationId: createPortfolio
      summary: Create a portfolio
      description: '`PMO` or `ORG_ADMIN`.'
      parameters:
        - $ref: '#/components/parameters/OrganizationId'
        - $ref: '#/components/parameters/CorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePortfolioRequest'
      responses:
        '201':
          description: Portfolio created
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
            Location:
              description: URL of the new resource
              schema:
                type: string
            X-Correlation-Id:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Portfolio'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'
  /portfolios/{portfolioId}:
    get:
      tags: [Portfolios]
      operationId: getPortfolio
      summary: Get a portfolio
      parameters:
        - $ref: '#/components/parameters/PortfolioId'
        - $ref: '#/components/parameters/OrganizationId'
