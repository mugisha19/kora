            $ref: '#/components/schemas/StakeholderGridEntry'
    StakeholderGrid:
      type: object
      required: [projectId, quadrants]
      properties:
        projectId:
          type: string
          format: uuid
        quadrants:
          type: array
          items:
            $ref: '#/components/schemas/StakeholderGridQuadrant'

    # ---------- Change requests ----------
    ChangeRequestType:
      type: string
      enum: [SCOPE, SCHEDULE, COST, QUALITY, OTHER]
    ChangeRequestStatus:
      type: string
      description: |
        DRAFT → SUBMITTED → IN_REVIEW (after the first approval) → APPROVED → IMPLEMENTED; a rejection makes it
        REJECTED (revise to try again); DRAFT, SUBMITTED and IN_REVIEW can be WITHDRAWN.
      enum: [DRAFT, SUBMITTED, IN_REVIEW, APPROVED, REJECTED, WITHDRAWN, IMPLEMENTED]
    ChangeImpact:
      type: object
      properties:
        costDelta:
          allOf:
            - $ref: '#/components/schemas/Money'
          description: Added cost (negative for a saving), in the organization's currency
        scheduleDeltaDays:
          type: integer
          format: int32
          minimum: -1000
          maximum: 1000
          description: Working days added to the target end date (negative to pull it in)
        scopeSummary:
          type: string
          maxLength: 2000
        riskSummary:
          type: string
          maxLength: 2000
        changesCharterScope:
          type: boolean
          default: false
          description: Approving it adds the scope summary to a new charter version (the sponsor must approve)
    ApprovalLevel:
      type: string
      enum: [PROJECT_MANAGER, PMO, SPONSOR]
    Decision:
      type: string
      enum: [APPROVE, REJECT]
    ApprovalStep:
      type: object
      required: [position, level, reason, state]
      properties:
        position:
          type: integer
          format: int32
          description: 1 for the first step
        level:
          $ref: '#/components/schemas/ApprovalLevel'
        reason:
          type: string
          description: Why this step is in the chain, e.g. "Cost change of 8% exceeds 5%"
        approver:
          allOf:
            - $ref: '#/components/schemas/UserRef'
          description: The one person who decides, when the step names someone
        approverRole:
          allOf:
            - $ref: '#/components/schemas/Role'
          description: Any member with this role (except the requester) decides, when the step names a role
        state:
          type: string
          enum: [WAITING, PENDING, APPROVED, REJECTED, SKIPPED]
          description: 'PENDING: its turn now; WAITING: a later step; SKIPPED: not reached (after a rejection)'
        decidedBy:
          $ref: '#/components/schemas/UserRef'
        comment:
          type: string
        decidedAt:
          type: string
          format: date-time
    ChangeRequest:
      type: object
      required: [id, key, revision, projectId, title, type, status, impact, requestedBy, steps, createdAt,
                 version]
      properties:
        id:
          type: string
          format: uuid
        key:
          type: string
          example: AKG-12-CR2
        revision:
          type: integer
          format: int32
          description: 1, then 2, 3... for each revision after a rejection; the key stays the same
        projectId:
          type: string
          format: uuid
        title:
          type: string
        description:
          type: string
        reason:
          type: string
        type:
          $ref: '#/components/schemas/ChangeRequestType'
        status:
          $ref: '#/components/schemas/ChangeRequestStatus'
        impact:
          $ref: '#/components/schemas/ChangeImpact'
        requestedBy:
          $ref: '#/components/schemas/UserRef'
        issueId:
          type: string
          format: uuid
        previousRevisionId:
          type: string
          format: uuid
        steps:
          type: array
          description: The approval chain, empty until submission
          items:
            $ref: '#/components/schemas/ApprovalStep'
        submittedAt:
          type: string
          format: date-time
        decidedAt:
          type: string
          format: date-time
        createdAt:
          type: string
          format: date-time
        version:
          type: integer
          format: int64
    ChangeRequestPage:
      allOf:
        - $ref: '#/components/schemas/PageMetadata'
        - type: object
          required: [content]
          properties:
            content:
              type: array
              items:
                $ref: '#/components/schemas/ChangeRequest'
    CreateChangeRequestRequest:
      type: object
      required: [title, type, reason]
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 200
        description:
          type: string
          maxLength: 4000
        reason:
          type: string
          minLength: 1
          maxLength: 2000
        type:
          $ref: '#/components/schemas/ChangeRequestType'
        impact:
          $ref: '#/components/schemas/ChangeImpact'
        issueId:
          type: string
          format: uuid
    UpdateChangeRequestRequest:
      type: object
      minProperties: 1
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 200
        description:
          type: string
          maxLength: 4000
        reason:
          type: string
          minLength: 1
          maxLength: 2000
        type:
          $ref: '#/components/schemas/ChangeRequestType'
        impact:
          $ref: '#/components/schemas/ChangeImpact'
    DecisionRequest:
      type: object
      required: [decision]
      properties:
        decision:
          $ref: '#/components/schemas/Decision'
        comment:
          type: string
          maxLength: 2000
          description: Required to reject
    ChangeControlSettings:
      type: object
      required: [pmoCostPercent, pmoScheduleDays, sponsorCostPercent, version]
      properties:
        pmoCostPercent:
          type: number
          description: PMO approval when the cost change exceeds this share of the budget
        pmoScheduleDays:
          type: integer
          format: int32
          description: PMO approval when the schedule change exceeds this many working days
        sponsorCostPercent:
          type: number
          description: Sponsor approval when the cost change exceeds this share of the budget
        version:
          type: integer
          format: int64
          description: 0 until the settings are first changed
    UpdateChangeControlSettingsRequest:
      type: object
      required: [pmoCostPercent, pmoScheduleDays, sponsorCostPercent]
      properties:
        pmoCostPercent:
          type: number
          minimum: 0
          maximum: 100
        pmoScheduleDays:
          type: integer
          format: int32
          minimum: 0
          maximum: 1000
        sponsorCostPercent:
          type: number
          minimum: 0
          maximum: 100

    # ---------- Timesheets (0.6.0) ----------
    TimesheetStatus:
      type: string
      description: 'DRAFT → SUBMITTED → APPROVED, or REJECTED (editable again) with the reviewer''s comment'
      enum: [DRAFT, SUBMITTED, APPROVED, REJECTED]
    TimesheetEntry:
