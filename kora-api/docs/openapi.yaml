components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: 'Access token from `SessionResponse`, valid 15 minutes. Kept in memory by the client.'
    refreshCookie:
      type: apiKey
      in: cookie
      name: kora_refresh
      description: 'Opaque refresh token. `HttpOnly; Secure; SameSite=Strict; Path=/api/v1/auth`.'

  parameters:
    OrganizationId:
      name: X-Organization-Id
      in: header
      required: true
      description: The active organization; must be one of the caller's memberships
      schema:
        type: string
        format: uuid
    CorrelationId:
      name: X-Correlation-Id
      in: header
      required: false
      description: Optional client-generated id echoed in the response and logs
      schema:
        type: string
        pattern: '^[A-Za-z0-9-]{1,64}$'
    IfMatch:
      name: If-Match
      in: header
      required: true
      description: The `ETag` of the version being updated, e.g. `"3"`
      schema:
        type: string
        example: '"3"'
    Page:
      name: page
      in: query
      description: 0-based page index
      schema:
        type: integer
        format: int32
        minimum: 0
        default: 0
    Size:
      name: size
      in: query
      description: Page size (values above 100 are capped at 100)
      schema:
        type: integer
        format: int32
        minimum: 1
        maximum: 100
        default: 20
    Sort:
      name: sort
      in: query
      description: '`field,asc` or `field,desc`; repeat for secondary sorts'
      style: form
      explode: true
      schema:
        type: array
        items:
          type: string
          pattern: '^[A-Za-z]+(,(asc|desc))?$'
    MemberId:
      name: memberId
      in: path
      required: true
      description: Membership id (not the user id)
      schema:
        type: string
        format: uuid
    InvitationId:
      name: invitationId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    InvitationToken:
      name: token
      in: path
      required: true
      description: Opaque token from the invitation email
      schema:
        type: string
        minLength: 20
        maxLength: 200

    PortfolioId:
      name: portfolioId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ProgramId:
      name: programId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ProjectId:
      name: projectId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    NodeId:
      name: nodeId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    UserId:
      name: userId
      in: path
      required: true
      description: The person's user id (as in `Member.userId`)
      schema:
        type: string
        format: uuid

    TaskId:
      name: taskId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    SprintId:
      name: sprintId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    BoardStatus:
      name: status
      in: path
      required: true
      description: A board column (every task status except BACKLOG)
      schema:
        type: string
        enum: [TODO, IN_PROGRESS, BLOCKED, IN_REVIEW, DONE]

  headers:
    CorrelationId:
      description: The request's correlation id
      schema:
        type: string
    ETag:
      description: Current version of the resource, quoted, e.g. `"4"`
      schema:
        type: string
    RetryAfter:
      description: Seconds to wait before retrying
      schema:
        type: integer
    SetRefreshCookie:
      description: '`kora_refresh=<token>; Max-Age=...; Path=/api/v1/auth; HttpOnly; Secure; SameSite=Strict`'
      schema:
        type: string
    ClearRefreshCookie:
      description: '`kora_refresh=; Max-Age=0; Path=/api/v1/auth; HttpOnly; Secure; SameSite=Strict`'
      schema:
        type: string

  responses:
    BadRequest:
      description: 'Invalid input. Code: `validation.failed` with `errors[]`, or `tenant.header_invalid`.'
      headers:
        X-Correlation-Id:
          $ref: '#/components/headers/CorrelationId'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Unauthenticated:
      description: 'Missing, invalid or expired access token. Code: `auth.unauthenticated`. Refresh and retry.'
      headers:
        X-Correlation-Id:
          $ref: '#/components/headers/CorrelationId'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    InvalidCredentials:
      description: 'Wrong email or password (indistinguishable). Code: `auth.invalid_credentials`.'
      headers:
        X-Correlation-Id:
          $ref: '#/components/headers/CorrelationId'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Forbidden:
      description: 'Not a member of the organization (`tenant.forbidden`) or role not allowed (`access.denied`).'
      headers:
        X-Correlation-Id:
          $ref: '#/components/headers/CorrelationId'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    NotFound:
      description: 'No such resource in this organization. Code: `resource.not_found`.'
      headers:
        X-Correlation-Id:
          $ref: '#/components/headers/CorrelationId'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    InvitationNotFound:
      description: 'Unknown invitation token. Code: `invitations.not_found`.'
      headers:
        X-Correlation-Id:
          $ref: '#/components/headers/CorrelationId'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    InvitationGone:
      description: 'Invitation no longer usable: `invitations.expired`, `invitations.revoked` or `invitations.already_accepted`.'
      headers:
        X-Correlation-Id:
          $ref: '#/components/headers/CorrelationId'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    PreconditionFailed:
      description: 'Someone else saved first; reload and retry. Code: `concurrency.stale_version`.'
      headers:
        X-Correlation-Id:
          $ref: '#/components/headers/CorrelationId'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    PreconditionRequired:
      description: '`If-Match` header missing or malformed. Code: `concurrency.if_match_required`.'
      headers:
        X-Correlation-Id:
          $ref: '#/components/headers/CorrelationId'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    TooManyRequests:
      description: 'Rate limit hit. Code: `rate_limited`.'
      headers:
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
        X-Correlation-Id:
          $ref: '#/components/headers/CorrelationId'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    InternalError:
      description: 'Unexpected failure; details are only in the server logs. Code: `internal.error`.'
      headers:
        X-Correlation-Id:
          $ref: '#/components/headers/CorrelationId'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'

  schemas:
    # ---------- Errors ----------
    Problem:
      type: object
      description: RFC 9457 Problem Details with Kora extensions
      required: [type, title, status, code, correlationId]
      properties:
        type:
          type: string
          description: '`urn:kora:problem:<code>`'
          example: urn:kora:problem:members.last_admin
        title:
          type: string
          description: Short, human-readable summary of the status
          example: Conflict
        status:
          type: integer
          format: int32
          example: 409
        detail:
          type: string
          description: Developer-oriented explanation; clients show a translated message chosen by `code`
        instance:
          type: string
          description: Path of the request that failed
          example: /api/v1/members/2b4b1f2e-7c1a-4f61-9d1e-3a8f0b5c6d7e
        code:
          $ref: '#/components/schemas/ErrorCode'
        correlationId:
          type: string
          example: 7f3c9a2e-5b1d-4e8f-a6c4-2d9b0e1f3a5c
        errors:
          type: array
          description: Field-level problems (present for `validation.failed` and some conflicts)
          items:
            $ref: '#/components/schemas/FieldError'
    FieldError:
      type: object
      required: [field, code, message]
      properties:
        field:
          type: string
          description: Request field path, e.g. `email` or `objectives[2].metric`; `body` for unreadable JSON
          example: password
        code:
          type: string
          description: |
            Field-agnostic reason: `required`, `length`, `format`, `email`, `range`, `invalid`,
            `password.breached`, or a domain code such as `invitations.already_member`.
          example: length
        message:
          type: string
          description: English developer message
          example: size must be between 12 and 128
        params:
          type: object
          description: 'Values for the translated message, e.g. `{ "min": 12, "max": 128 }`'
          additionalProperties: true
    ErrorCode:
      type: string
      description: |
        Stable machine-readable error code. New codes may be added in minor versions; clients should fall
        back to a generic message for unknown codes.
      enum:
        - validation.failed
        - auth.unauthenticated
        - auth.invalid_credentials
        - auth.refresh_invalid
        - auth.email_taken
        - auth.reset_token_invalid
        - tenant.forbidden
        - tenant.header_invalid
        - access.denied
        - resource.not_found
        - method.not_allowed
        - media_type.unsupported
        - concurrency.stale_version
        - concurrency.if_match_required
        - members.last_admin
        - members.self_removal
        - invitations.already_member
        - invitations.already_pending
        - invitations.not_pending
        - invitations.not_found
        - invitations.expired
        - invitations.revoked
        - invitations.already_accepted
        - rate_limited
        - organization.currency_locked
        - portfolios.archived
        - portfolios.not_empty
        - projects.code_taken
        - projects.invalid_transition
        - projects.charter_approval_required
        - projects.methodology_locked
        - project_members.is_manager
        - charters.not_draft
        - charters.not_submitted
        - charters.incomplete
        - wbs.parent_not_deliverable
        - wbs.too_deep
        - wbs.cycle
        - wbs.has_children
        - wbs.type_change_not_allowed
        - tasks.invalid_transition
        - tasks.wip_limit_reached
        - tasks.remaining_work
        - sprints.not_agile
        - sprints.already_active
        - sprints.not_planned
        - sprints.not_active
        - sprints.closed
        - internal.error

    # ---------- Shared ----------
    Role:
      type: string
      enum: [ORG_ADMIN, PMO, PROJECT_MANAGER, MEMBER, VIEWER]
    Locale:
      type: string
      enum: [en, fr, rw]
    Email:
      type: string
      format: email
      maxLength: 254
      example: pm@kora.demo
    NewPassword:
      type: string
      format: password
      minLength: 12
      maxLength: 128
      description: 12–128 characters; rejected if found in a breached-password list (`password.breached`)
    FullName:
      type: string
      minLength: 1
      maxLength: 120
      example: Aline Uwase
    PageMetadata:
      type: object
      required: [page, size, totalElements, totalPages]
      properties:
        page:
          type: integer
          format: int32
          description: 0-based index of this page
          example: 0
        size:
          type: integer
          format: int32
          example: 20
        totalElements:
          type: integer
          format: int64
          example: 57
        totalPages:
          type: integer
          format: int32
          example: 3

    # ---------- Auth ----------
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          $ref: '#/components/schemas/Email'
        password:
          type: string
          format: password
          minLength: 1
          maxLength: 128
    RegisterOrganizationRequest:
      type: object
      required: [organizationName, fullName, email, password]
      properties:
        organizationName:
          type: string
          minLength: 2
          maxLength: 100
          example: Akagera Digital Ltd
        fullName:
          $ref: '#/components/schemas/FullName'
        email:
          $ref: '#/components/schemas/Email'
        password:
          $ref: '#/components/schemas/NewPassword'
        currency:
          type: string
          pattern: '^[A-Z]{3}$'
          description: ISO 4217 code
          default: RWF
        timeZone:
          type: string
          description: IANA time zone id
          default: Africa/Kigali
    ForgotPasswordRequest:
      type: object
      required: [email]
      properties:
        email:
          $ref: '#/components/schemas/Email'
    ResetPasswordRequest:
      type: object
      required: [token, newPassword]
      properties:
        token:
          type: string
          minLength: 20
          maxLength: 200
        newPassword:
          $ref: '#/components/schemas/NewPassword'
    SessionResponse:
      type: object
      required: [accessToken, tokenType, expiresIn, user]
      properties:
        accessToken:
          type: string
          description: 'JWT; send as `Authorization: Bearer <token>`'
        tokenType:
          type: string
          enum: [Bearer]
        expiresIn:
          type: integer
          format: int32
          description: Seconds until the access token expires
          example: 900
        user:
          $ref: '#/components/schemas/MeResponse'

    # ---------- Me ----------
    MeResponse:
      type: object
      required: [id, email, fullName, locale, memberships]
      properties:
        id:
          type: string
          format: uuid
        email:
          $ref: '#/components/schemas/Email'
        fullName:
          $ref: '#/components/schemas/FullName'
        locale:
          $ref: '#/components/schemas/Locale'
        memberships:
          type: array
          items:
            $ref: '#/components/schemas/Membership'
    Membership:
      type: object
      required: [organizationId, organizationName, organizationSlug, role]
      properties:
        organizationId:
          type: string
          format: uuid
        organizationName:
          type: string
          example: Akagera Digital Ltd
        organizationSlug:
          type: string
          example: akagera-digital-ltd
        role:
          $ref: '#/components/schemas/Role'
    UpdateMeRequest:
      type: object
      minProperties: 1
      properties:
        fullName:
          $ref: '#/components/schemas/FullName'
        locale:
          $ref: '#/components/schemas/Locale'

    # ---------- Organization ----------
    Organization:
      type: object
      required: [id, name, slug, currency, timeZone, createdAt, version]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          example: Akagera Digital Ltd
        slug:
          type: string
          pattern: '^[a-z0-9]+(-[a-z0-9]+)*$'
          example: akagera-digital-ltd
        currency:
          type: string
          pattern: '^[A-Z]{3}$'
          example: RWF
        timeZone:
          type: string
          example: Africa/Kigali
        createdAt:
          type: string
          format: date-time
        version:
          type: integer
          format: int64
          example: 3
    UpdateOrganizationRequest:
      type: object
      minProperties: 1
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 100
        currency:
          type: string
          pattern: '^[A-Z]{3}$'
        timeZone:
          type: string

    # ---------- Members ----------
    Member:
      type: object
      required: [id, userId, email, fullName, role, joinedAt, version]
      properties:
        id:
          type: string
          format: uuid
          description: Membership id
        userId:
          type: string
          format: uuid
        email:
          $ref: '#/components/schemas/Email'
        fullName:
          $ref: '#/components/schemas/FullName'
        role:
          $ref: '#/components/schemas/Role'
        joinedAt:
          type: string
          format: date-time
        version:
          type: integer
          format: int64
    MemberPage:
      allOf:
        - $ref: '#/components/schemas/PageMetadata'
        - type: object
          required: [content]
          properties:
            content:
              type: array
              items:
                $ref: '#/components/schemas/Member'
    ChangeMemberRoleRequest:
      type: object
      required: [role]
      properties:
        role:
          $ref: '#/components/schemas/Role'

    # ---------- Invitations ----------
    InvitationStatus:
      type: string
      enum: [PENDING, ACCEPTED, REVOKED, EXPIRED]
    Invitation:
      type: object
      required: [id, email, role, status, invitedByName, createdAt, expiresAt]
      properties:
        id:
          type: string
          format: uuid
        email:
          $ref: '#/components/schemas/Email'
        role:
          $ref: '#/components/schemas/Role'
        status:
          $ref: '#/components/schemas/InvitationStatus'
        invitedByName:
          type: string
        createdAt:
          type: string
          format: date-time
        expiresAt:
          type: string
          format: date-time
    InvitationPage:
      allOf:
        - $ref: '#/components/schemas/PageMetadata'
        - type: object
          required: [content]
          properties:
            content:
              type: array
              items:
                $ref: '#/components/schemas/Invitation'
    CreateInvitationRequest:
      type: object
      required: [email, role]
      properties:
        email:
          $ref: '#/components/schemas/Email'
        role:
          $ref: '#/components/schemas/Role'
    InvitationPreview:
      type: object
      required: [organizationName, email, role, invitedByName, expiresAt, existingAccount]
      properties:
        organizationName:
          type: string
        email:
          $ref: '#/components/schemas/Email'
        role:
          $ref: '#/components/schemas/Role'
        invitedByName:
          type: string
        expiresAt:
          type: string
          format: date-time
        existingAccount:
          type: boolean
          description: True when the email already has a Kora account (accept with current password only)
    AcceptInvitationRequest:
      type: object
      required: [password]
      properties:
        fullName:
          allOf:
            - $ref: '#/components/schemas/FullName'
          description: Required for a new account; ignored for an existing one
        password:
          type: string
          format: password
          minLength: 1
          maxLength: 128
          description: New account — a new password (12–128, not breached). Existing account — the current password.

    # ---------- Shared (0.2.0) ----------
    Money:
      type: object
      required: [amount, currency]
      description: 'A decimal amount as a string (never a binary float) in the organization''s currency'
      properties:
        amount:
          type: string
          pattern: '^-?[0-9]{1,15}(\.[0-9]{1,4})?$'
          example: '12500000'
        currency:
          type: string
          pattern: '^[A-Z]{3}$'
          example: RWF
    UserRef:
      type: object
      required: [userId, fullName]
      properties:
        userId:
          type: string
          format: uuid
        fullName:
          type: string
          example: Aline Uwase
    Health:
      type: string
      description: 'RAG status: GREY = not started or finished; see the dashboard rule (ADR 0008)'
      enum: [GREEN, AMBER, RED, GREY]
    TextList:
      type: array
      maxItems: 50
      items:
        type: string
        minLength: 1
        maxLength: 500

    # ---------- Portfolios and programs ----------
    PortfolioStatus:
      type: string
      enum: [ACTIVE, ARCHIVED]
    Portfolio:
      type: object
      required: [id, name, strategicObjectives, owner, status, programCount, projectCount, createdAt, version]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          example: Digital Services 2026
        description:
          type: string
        strategicObjectives:
          $ref: '#/components/schemas/TextList'
        owner:
          $ref: '#/components/schemas/UserRef'
        status:
          $ref: '#/components/schemas/PortfolioStatus'
        programCount:
          type: integer
          format: int32
        projectCount:
          type: integer
          format: int32
        createdAt:
          type: string
          format: date-time
        version:
          type: integer
          format: int64
    PortfolioPage:
      allOf:
        - $ref: '#/components/schemas/PageMetadata'
        - type: object
          required: [content]
          properties:
            content:
              type: array
              items:
                $ref: '#/components/schemas/Portfolio'
    CreatePortfolioRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 100
        description:
          type: string
          maxLength: 2000
        strategicObjectives:
          $ref: '#/components/schemas/TextList'
        ownerId:
          type: string
          format: uuid
          description: Defaults to the caller; must be `PMO` or `ORG_ADMIN`
    UpdatePortfolioRequest:
      type: object
      minProperties: 1
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 100
        description:
          type: string
          maxLength: 2000
        strategicObjectives:
          $ref: '#/components/schemas/TextList'
        ownerId:
          type: string
          format: uuid
        status:
          $ref: '#/components/schemas/PortfolioStatus'
    ProgramStatus:
      type: string
      enum: [ACTIVE, CLOSED]
    Program:
      type: object
      required: [id, portfolioId, name, manager, status, projectCount, createdAt, version]
      properties:
        id:
          type: string
          format: uuid
        portfolioId:
          type: string
          format: uuid
        name:
          type: string
          example: Customer Channels
        description:
          type: string
        manager:
          $ref: '#/components/schemas/UserRef'
        status:
          $ref: '#/components/schemas/ProgramStatus'
        projectCount:
          type: integer
          format: int32
        createdAt:
          type: string
          format: date-time
        version:
          type: integer
          format: int64
    CreateProgramRequest:
      type: object
      required: [name, managerId]
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 100
        description:
          type: string
          maxLength: 2000
        managerId:
          type: string
          format: uuid
          description: Must be `PROJECT_MANAGER`, `PMO` or `ORG_ADMIN`
    UpdateProgramRequest:
      type: object
      minProperties: 1
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 100
        description:
          type: string
          maxLength: 2000
        managerId:
          type: string
          format: uuid
        status:
          $ref: '#/components/schemas/ProgramStatus'

    # ---------- Projects ----------
    Methodology:
      type: string
      description: 'Decides which workspace tabs apply: AGILE (board, backlog), PREDICTIVE (schedule), HYBRID (both)'
      enum: [AGILE, PREDICTIVE, HYBRID]
    ProjectStatus:
      type: string
      enum: [PROPOSED, APPROVED, IN_PROGRESS, ON_HOLD, CLOSING, CLOSED, CANCELLED]
    Project:
      type: object
      required: [id, code, name, portfolioId, manager, methodology, status, allowedTransitions, startDate,
                 targetEndDate, health, healthOverridden, createdAt, version]
      properties:
        id:
          type: string
          format: uuid
        code:
          type: string
          example: AKG-012
        name:
          type: string
          example: Mobile banking app
        description:
          type: string
        portfolioId:
          type: string
          format: uuid
        programId:
          type: string
          format: uuid
        manager:
          $ref: '#/components/schemas/UserRef'
        methodology:
          $ref: '#/components/schemas/Methodology'
        status:
          $ref: '#/components/schemas/ProjectStatus'
        allowedTransitions:
          type: array
          description: Statuses the project may move to next through `POST /transitions`
          items:
            $ref: '#/components/schemas/ProjectStatus'
        startDate:
          type: string
          format: date
        targetEndDate:
          type: string
          format: date
        budget:
          $ref: '#/components/schemas/Money'
        health:
          $ref: '#/components/schemas/Health'
        healthReason:
          type: string
          description: Why the project has this health (the override reason when overridden)
        healthOverridden:
          type: boolean
        createdAt:
          type: string
          format: date-time
        version:
          type: integer
          format: int64
    ProjectPage:
      allOf:
        - $ref: '#/components/schemas/PageMetadata'
        - type: object
          required: [content]
          properties:
            content:
              type: array
              items:
                $ref: '#/components/schemas/Project'
    ProjectCode:
      type: string
      description: Unique in the organization; upper-case letters, digits and dashes
      pattern: '^[A-Z][A-Z0-9-]{1,14}$'
      example: AKG-012
    CreateProjectRequest:
      type: object
      required: [code, name, portfolioId, methodology, startDate, targetEndDate]
      properties:
        code:
          $ref: '#/components/schemas/ProjectCode'
        name:
          type: string
          minLength: 2
          maxLength: 150
        description:
          type: string
          maxLength: 4000
        portfolioId:
          type: string
          format: uuid
        programId:
          type: string
          format: uuid
          description: Must belong to the same portfolio
        managerId:
          type: string
          format: uuid
          description: Defaults to the caller
        methodology:
          $ref: '#/components/schemas/Methodology'
        startDate:
          type: string
          format: date
        targetEndDate:
          type: string
          format: date
          description: After `startDate`
        budget:
          $ref: '#/components/schemas/Money'
    UpdateProjectRequest:
      type: object
      minProperties: 1
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 150
        description:
          type: string
          maxLength: 4000
        programId:
          type: string
          format: uuid
        managerId:
          type: string
          format: uuid
        methodology:
          $ref: '#/components/schemas/Methodology'
        startDate:
          type: string
          format: date
        targetEndDate:
          type: string
          format: date
        budget:
          $ref: '#/components/schemas/Money'
    TransitionRequest:
      type: object
      required: [to]
      properties:
        to:
          $ref: '#/components/schemas/ProjectStatus'
        reason:
          type: string
          maxLength: 500
          description: Required when moving to `ON_HOLD` or `CANCELLED`
    HealthOverrideRequest:
      type: object
      required: [health, reason]
      properties:
        health:
          type: string
          enum: [GREEN, AMBER, RED]
        reason:
          type: string
          minLength: 1
          maxLength: 500
    ProjectRole:
      type: string
      description: 'MANAGER is the project manager (set on the project); CONTRIBUTOR works on it; OBSERVER reads it'
      enum: [MANAGER, CONTRIBUTOR, OBSERVER]
    ProjectMember:
      type: object
      required: [userId, fullName, email, projectRole, addedAt]
      properties:
        userId:
          type: string
          format: uuid
        fullName:
          type: string
        email:
          $ref: '#/components/schemas/Email'
        projectRole:
          $ref: '#/components/schemas/ProjectRole'
        addedAt:
          type: string
          format: date-time
    PutProjectMemberRequest:
      type: object
      required: [projectRole]
      properties:
        projectRole:
          type: string
          enum: [CONTRIBUTOR, OBSERVER]

    # ---------- Charter ----------
    CharterStatus:
      type: string
      enum: [DRAFT, SUBMITTED, APPROVED, SUPERSEDED]
    CharterObjective:
      type: object
      required: [text, successMetric]
      properties:
        text:
          type: string
          minLength: 1
          maxLength: 500
          description: A SMART objective
        successMetric:
          type: string
          minLength: 1
          maxLength: 300
    CharterMilestone:
      type: object
      required: [name, targetDate]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
        targetDate:
          type: string
          format: date
    CharterContent:
      type: object
      description: The editable part of a charter; a PUT replaces all of it
      properties:
        purpose:
          type: string
          maxLength: 4000
        businessCase:
          type: string
          maxLength: 8000
        objectives:
          type: array
          maxItems: 30
          items:
            $ref: '#/components/schemas/CharterObjective'
        inScope:
          $ref: '#/components/schemas/TextList'
        outOfScope:
          $ref: '#/components/schemas/TextList'
        assumptions:
          $ref: '#/components/schemas/TextList'
        constraints:
          $ref: '#/components/schemas/TextList'
        highLevelRisks:
          $ref: '#/components/schemas/TextList'
        milestones:
          type: array
          maxItems: 50
          items:
            $ref: '#/components/schemas/CharterMilestone'
        summaryBudget:
          $ref: '#/components/schemas/Money'
        sponsorId:
          type: string
          format: uuid
    Charter:
      type: object
      required: [projectId, versionNumber, status, objectives, inScope, outOfScope, assumptions, constraints,
                 highLevelRisks, milestones, version]
      properties:
        projectId:
          type: string
          format: uuid
        versionNumber:
          type: integer
          format: int32
          description: 1 for the first charter; a new number each time an approved charter is superseded
          example: 1
        status:
          $ref: '#/components/schemas/CharterStatus'
        purpose:
          type: string
        businessCase:
          type: string
        objectives:
          type: array
          items:
            $ref: '#/components/schemas/CharterObjective'
        inScope:
          $ref: '#/components/schemas/TextList'
        outOfScope:
          $ref: '#/components/schemas/TextList'
        assumptions:
          $ref: '#/components/schemas/TextList'
        constraints:
          $ref: '#/components/schemas/TextList'
        highLevelRisks:
          $ref: '#/components/schemas/TextList'
        milestones:
          type: array
          items:
            $ref: '#/components/schemas/CharterMilestone'
        summaryBudget:
          $ref: '#/components/schemas/Money'
        sponsor:
          $ref: '#/components/schemas/UserRef'
        submittedAt:
          type: string
          format: date-time
        approvedBy:
          $ref: '#/components/schemas/UserRef'
        approvedAt:
          type: string
          format: date-time
        returnComment:
          type: string
          description: Why the approver sent the last submission back
        version:
          type: integer
          format: int64
    ReturnCharterRequest:
      type: object
      required: [comment]
      properties:
        comment:
          type: string
          minLength: 1
          maxLength: 2000

    # ---------- WBS ----------
    WbsNodeType:
      type: string
      description: 'DELIVERABLE groups other nodes; WORK_PACKAGE is a leaf that carries effort, cost and progress'
      enum: [DELIVERABLE, WORK_PACKAGE]
    WbsNode:
      type: object
      required: [id, code, name, type, plannedEffortHours, plannedCost, percentComplete, percentCompleteSource,
                 earnedValue, version, children]
      properties:
        id:
          type: string
          format: uuid
        parentId:
          type: string
          format: uuid
        code:
          type: string
          description: Outline number derived from the position in the tree, e.g. `1.2.3`
          example: 1.2.3
        name:
          type: string
        description:
          type: string
        type:
          $ref: '#/components/schemas/WbsNodeType'
        owner:
          $ref: '#/components/schemas/UserRef'
        plannedEffortHours:
          type: number
          description: A work package's own estimate, or the sum over a deliverable's subtree
        plannedCost:
          $ref: '#/components/schemas/Money'
        percentComplete:
          type: number
          minimum: 0
          maximum: 100
          description: A work package's reported progress, or the effort-weighted average over a subtree
        percentCompleteSource:
          type: string
          enum: [REPORTED, TASKS, ROLLED_UP]
          description: 'REPORTED: entered on the work package; TASKS: derived from its tasks (read-only);
            ROLLED_UP: a deliverable''s average of its children'
        earnedValue:
          $ref: '#/components/schemas/Money'
        version:
          type: integer
          format: int64
        children:
          type: array
          items:
            $ref: '#/components/schemas/WbsNode'
    WbsTree:
      type: object
      required: [projectId, plannedEffortHours, plannedCost, percentComplete, earnedValue, nodes]
      properties:
        projectId:
          type: string
          format: uuid
        plannedEffortHours:
          type: number
        plannedCost:
          $ref: '#/components/schemas/Money'
        percentComplete:
          type: number
        earnedValue:
          $ref: '#/components/schemas/Money'
        nodes:
          type: array
          description: Top-level nodes (codes 1, 2, 3...) with their subtrees
          items:
            $ref: '#/components/schemas/WbsNode'
    CreateWbsNodeRequest:
      type: object
      required: [name, type]
      properties:
        parentId:
          type: string
          format: uuid
          description: Omit for a top-level node; otherwise a deliverable
        name:
          type: string
          minLength: 1
          maxLength: 200
        description:
          type: string
          maxLength: 4000
        type:
          $ref: '#/components/schemas/WbsNodeType'
        ownerId:
          type: string
          format: uuid
        plannedEffortHours:
          type: number
          minimum: 0
          maximum: 1000000
          description: Work packages only
        plannedCost:
          type: string
          pattern: '^[0-9]{1,15}(\.[0-9]{1,4})?$'
          description: Work packages only; an amount in the organization's currency
        percentComplete:
          type: number
          minimum: 0
          maximum: 100
          description: Work packages only (physical percent complete)
        position:
          type: integer
          format: int32
          minimum: 0
          description: Place among its siblings (0-based); appended when omitted
    UpdateWbsNodeRequest:
      type: object
      minProperties: 1
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
        description:
          type: string
          maxLength: 4000
        type:
          $ref: '#/components/schemas/WbsNodeType'
        ownerId:
          type: string
          format: uuid
        plannedEffortHours:
          type: number
          minimum: 0
          maximum: 1000000
        plannedCost:
          type: string
          pattern: '^[0-9]{1,15}(\.[0-9]{1,4})?$'
        percentComplete:
          type: number
          minimum: 0
          maximum: 100
    MoveWbsNodeRequest:
      type: object
      required: [position]
      properties:
        newParentId:
          type: string
          format: uuid
          description: The new parent deliverable; omit to make it a top-level node
        position:
          type: integer
          format: int32
          minimum: 0

    # ---------- Dashboard ----------
    DashboardSummary:
      type: object
      required: [projectCount, byStatus, byHealth, totalBudget, totalPlannedCost, totalEarnedValue, lateProjects]
      properties:
        projectCount:
          type: integer
          format: int32
        byStatus:
          type: object
          description: Number of projects per `ProjectStatus` (statuses with no project are omitted)
          additionalProperties:
            type: integer
            format: int32
        byHealth:
          type: object
          description: Number of projects per `Health`
          additionalProperties:
            type: integer
            format: int32
        totalBudget:
          $ref: '#/components/schemas/Money'
        totalPlannedCost:
          $ref: '#/components/schemas/Money'
        totalEarnedValue:
          $ref: '#/components/schemas/Money'
        lateProjects:
          type: integer
          format: int32
          description: Projects in progress past their target end date
        portfolioSpi:
          type: number
          description: Schedule performance index (from API Phase 7)
        portfolioCpi:
          type: number
          description: Cost performance index (from API Phase 7)
        openCriticalRisks:
          type: integer
          format: int32
          description: From API Phase 6
        pendingChangeRequests:
          type: integer
          format: int32
          description: From API Phase 6
    NextMilestone:
      type: object
      required: [name, targetDate]
      properties:
        name:
          type: string
        targetDate:
          type: string
          format: date
    DashboardProject:
      type: object
      required: [projectId, code, name, portfolioId, manager, status, health, healthOverridden, percentComplete]
      properties:
        projectId:
          type: string
          format: uuid
        code:
          type: string
        name:
          type: string
        portfolioId:
          type: string
          format: uuid
        manager:
          $ref: '#/components/schemas/UserRef'
        status:
          $ref: '#/components/schemas/ProjectStatus'
        health:
          $ref: '#/components/schemas/Health'
        healthReason:
          type: string
        healthOverridden:
          type: boolean
        percentComplete:
          type: number
        targetEndDate:
          type: string
          format: date
        nextMilestone:
          $ref: '#/components/schemas/NextMilestone'
        spi:
          type: number
          description: From API Phase 7
        cpi:
          type: number
          description: From API Phase 7
    DashboardProjectPage:
      allOf:
        - $ref: '#/components/schemas/PageMetadata'
        - type: object
          required: [content]
          properties:
            content:
              type: array
              items:
                $ref: '#/components/schemas/DashboardProject'

    # ---------- Tasks and board (0.3.0) ----------
    TaskStatus:
      type: string
      description: 'BACKLOG → TODO → IN_PROGRESS → IN_REVIEW → DONE; BLOCKED from TODO or IN_PROGRESS (with a reason)'
      enum: [BACKLOG, TODO, IN_PROGRESS, BLOCKED, IN_REVIEW, DONE]
    TaskType:
      type: string
      enum: [STORY, TASK, BUG, CHORE]
    TaskPriority:
      type: string
      enum: [LOW, MEDIUM, HIGH, CRITICAL]
    Labels:
      type: array
      maxItems: 10
      items:
        type: string
        pattern: '^[\p{L}\p{N}][\p{L}\p{N} _-]{0,29}$'
    Task:
      type: object
      required: [id, key, projectId, title, type, priority, status, labels, rank, createdAt, version]
      properties:
        id:
          type: string
          format: uuid
        key:
          type: string
          description: Project code and task number
          example: AKG-012-34
        projectId:
          type: string
          format: uuid
        title:
          type: string
        description:
          type: string
          description: 'Markdown. Render it as Markdown only: raw HTML is not allowed and must not be rendered.'
        type:
          $ref: '#/components/schemas/TaskType'
        priority:
          $ref: '#/components/schemas/TaskPriority'
        status:
          $ref: '#/components/schemas/TaskStatus'
        blockedReason:
          type: string
        assignee:
          $ref: '#/components/schemas/UserRef'
        wbsNodeId:
          type: string
          format: uuid
          description: The work package this task belongs to
        sprintId:
          type: string
          format: uuid
        storyPoints:
          type: integer
          format: int32
        estimateHours:
          type: number
        remainingHours:
          type: number
        startDate:
          type: string
          format: date
        dueDate:
          type: string
          format: date
        labels:
          $ref: '#/components/schemas/Labels'
        rank:
          type: string
          description: Opaque sort key (lexorank); order tasks by it, never parse it
        createdAt:
          type: string
          format: date-time
        completedAt:
          type: string
          format: date-time
        version:
          type: integer
          format: int64
    TaskPage:
      allOf:
        - $ref: '#/components/schemas/PageMetadata'
        - type: object
          required: [content]
          properties:
            content:
              type: array
              items:
                $ref: '#/components/schemas/Task'
    CreateTaskRequest:
      type: object
      required: [title, type]
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 200
        description:
          type: string
          maxLength: 10000
        type:
          $ref: '#/components/schemas/TaskType'
        priority:
          $ref: '#/components/schemas/TaskPriority'
        status:
          type: string
          enum: [BACKLOG, TODO]
          default: BACKLOG
        assigneeId:
          type: string
          format: uuid
        wbsNodeId:
          type: string
          format: uuid
        sprintId:
          type: string
          format: uuid
        storyPoints:
          type: integer
          format: int32
          minimum: 0
          maximum: 100
        estimateHours:
          type: number
          minimum: 0
          maximum: 10000
        remainingHours:
          type: number
          minimum: 0
          maximum: 10000
        startDate:
          type: string
          format: date
        dueDate:
          type: string
          format: date
        labels:
          $ref: '#/components/schemas/Labels'
    UpdateTaskRequest:
      type: object
      minProperties: 1
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 200
        description:
          type: string
          maxLength: 10000
        type:
          $ref: '#/components/schemas/TaskType'
        priority:
          $ref: '#/components/schemas/TaskPriority'
        assigneeId:
          type: string
          format: uuid
        wbsNodeId:
          type: string
          format: uuid
        storyPoints:
          type: integer
          format: int32
          minimum: 0
          maximum: 100
        estimateHours:
          type: number
          minimum: 0
          maximum: 10000
        remainingHours:
          type: number
          minimum: 0
          maximum: 10000
        startDate:
          type: string
          format: date
        dueDate:
          type: string
          format: date
        labels:
          $ref: '#/components/schemas/Labels'
    MoveTaskRequest:
      type: object
      required: [status]
      properties:
        status:
          $ref: '#/components/schemas/TaskStatus'
        afterTaskId:
          type: string
          format: uuid
          description: The task that will be directly above
        beforeTaskId:
          type: string
          format: uuid
          description: The task that will be directly below
        override:
          type: boolean
          default: false
          description: Move into a column at its WIP limit anyway
        reason:
          type: string
          maxLength: 500
          description: Required when moving to BLOCKED
    TaskComment:
      type: object
      required: [id, author, body, createdAt]
      properties:
        id:
          type: string
          format: uuid
        author:
          $ref: '#/components/schemas/UserRef'
        body:
          type: string
          description: Markdown, rendered like a task description
        createdAt:
          type: string
          format: date-time
    CreateTaskCommentRequest:
      type: object
      required: [body]
      properties:
        body:
          type: string
          minLength: 1
          maxLength: 5000
    BoardColumnSettings:
      type: object
      required: [status, name]
      properties:
        status:
          type: string
          enum: [TODO, IN_PROGRESS, BLOCKED, IN_REVIEW, DONE]
        name:
          type: string
          minLength: 1
          maxLength: 40
        wipLimit:
          type: integer
          format: int32
          minimum: 1
          maximum: 100
    BoardColumn:
      type: object
      required: [status, name, taskCount, atLimit, tasks]
      properties:
        status:
          $ref: '#/components/schemas/TaskStatus'
        name:
          type: string
        wipLimit:
          type: integer
          format: int32
        taskCount:
          type: integer
          format: int32
        atLimit:
          type: boolean
          description: The column holds as many tasks as its WIP limit, or more
        tasks:
          type: array
          items:
            $ref: '#/components/schemas/Task'
    Board:
      type: object
      required: [projectId, columns]
      properties:
        projectId:
          type: string
          format: uuid
        sprintId:
          type: string
          format: uuid
        columns:
          type: array
          items:
            $ref: '#/components/schemas/BoardColumn'

    # ---------- Sprints ----------
    SprintStatus:
      type: string
      enum: [PLANNED, ACTIVE, CLOSED]
    Sprint:
      type: object
      required: [id, projectId, name, startDate, endDate, status, taskCount, totalPoints, version]
      properties:
        id:
          type: string
          format: uuid
        projectId:
          type: string
          format: uuid
        name:
          type: string
          example: Sprint 4
        goal:
          type: string
        startDate:
          type: string
          format: date
        endDate:
          type: string
          format: date
        status:
          $ref: '#/components/schemas/SprintStatus'
        taskCount:
          type: integer
          format: int32
        totalPoints:
          type: integer
          format: int32
          description: Story points of the tasks in the sprint now
        committedPoints:
          type: integer
          format: int32
          description: Frozen when the sprint starts
        completedPoints:
          type: integer
          format: int32
          description: Recorded when the sprint closes
        version:
          type: integer
          format: int64
    CreateSprintRequest:
      type: object
      required: [name, startDate, endDate]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        goal:
          type: string
          maxLength: 500
        startDate:
          type: string
          format: date
        endDate:
          type: string
          format: date
    UpdateSprintRequest:
      type: object
      minProperties: 1
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        goal:
          type: string
          maxLength: 500
        startDate:
          type: string
          format: date
        endDate:
          type: string
          format: date
    CloseSprintRequest:
      type: object
      required: [carryOverTo]
      properties:
        carryOverTo:
          type: string
          description: A planned sprint's id, or `BACKLOG`
          example: BACKLOG
    SprintTasksRequest:
      type: object
      required: [taskIds]
      properties:
        taskIds:
          type: array
          minItems: 1
          maxItems: 200
          items:
            type: string
            format: uuid
    BurndownDay:
      type: object
      required: [date, idealRemaining]
      properties:
        date:
          type: string
          format: date
        idealRemaining:
          type: number
        actualRemaining:
          type: integer
          format: int32
          description: Absent for days that haven't happened yet
    Burndown:
      type: object
      required: [sprintId, startDate, endDate, committedPoints, days]
      properties:
        sprintId:
          type: string
          format: uuid
        startDate:
          type: string
          format: date
        endDate:
          type: string
          format: date
        committedPoints:
          type: integer
          format: int32
        days:
          type: array
          items:
            $ref: '#/components/schemas/BurndownDay'
    VelocitySprint:
      type: object
      required: [sprintId, name, endDate, committedPoints, completedPoints]
      properties:
        sprintId:
          type: string
          format: uuid
        name:
          type: string
        endDate:
          type: string
          format: date
        committedPoints:
          type: integer
          format: int32
        completedPoints:
          type: integer
          format: int32
    Velocity:
      type: object
      required: [sprints]
      properties:
        sprints:
          type: array
          description: Oldest first
          items:
            $ref: '#/components/schemas/VelocitySprint'
        average:
          type: number
          description: Average completed points; absent before the first closed sprint
        low:
          type: integer
          format: int32
          description: Lowest completed points in the window (forecast range)
        high:
          type: integer
          format: int32
          description: Highest completed points in the window (forecast range)
