      properties:
        id:
          type: string
          format: uuid
        projectId:
          type: string
          format: uuid
        projectCode:
          type: string
        user:
          $ref: '#/components/schemas/UserRef'
        weekStart:
          type: string
          format: date
        status:
          $ref: '#/components/schemas/TimesheetStatus'
        totalHours:
          type: number
        submittedAt:
          type: string
          format: date-time
        decidedBy:
          $ref: '#/components/schemas/UserRef'
        decidedAt:
          type: string
          format: date-time
        comment:
          type: string
        entries:
          type: array
          items:
            $ref: '#/components/schemas/TimesheetEntry'
    TimesheetPage:
      allOf:
        - $ref: '#/components/schemas/PageMetadata'
        - type: object
          required: [content]
          properties:
            content:
              type: array
              items:
                $ref: '#/components/schemas/TimesheetSummary'
    DailyTotal:
      type: object
