          type: string
        user:
          $ref: '#/components/schemas/UserRef'
        weekStart:
          type: string
          format: date
        status:
          $ref: '#/components/schemas/TimesheetStatus'
        totalHours:
          type: number
        submittedAt:
          type: string
          format: date-time
        decidedBy:
          $ref: '#/components/schemas/UserRef'
        decidedAt:
          type: string
          format: date-time
        comment:
          type: string
    Timesheet:
