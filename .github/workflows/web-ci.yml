# CI for the Angular web app. Runs only when kora-web, this workflow or the API contract changes,
# so API-only commits don't spend minutes on Node tooling, but a contract change re-checks the client.
name: web-ci

on:
  push:
    branches: ['**']
    tags: ['web-v*', 'v*']
    paths: ['kora-web/**', 'kora-api/docs/openapi.yaml', '.github/workflows/web-ci.yml']
  pull_request:
    paths: ['kora-web/**', 'kora-api/docs/openapi.yaml', '.github/workflows/web-ci.yml']

# A newer push to the same branch cancels the run that is now out of date.
concurrency:
  group: web-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    working-directory: kora-web

jobs:
  quality:
    name: Format, lint, contract check, unit tests, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: kora-web/.nvmrc
          cache: npm
          cache-dependency-path: kora-web/package-lock.json
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run api:check
      - run: npm run test:ci
      - run: npm run build
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: web-coverage
          path: kora-web/coverage
          if-no-files-found: ignore

  e2e:
    name: Playwright end-to-end (with axe)
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: kora-web/.nvmrc
          cache: npm
          cache-dependency-path: kora-web/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e
        env:
          CI: 'true'
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: kora-web/playwright-report
          retention-days: 7

  image:
    name: Nginx image, smoke check and vulnerability scan
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: kora-web
          load: true
          tags: kora-web:${{ github.sha }}
          cache-from: type=gha,scope=kora-web
          cache-to: type=gha,mode=max,scope=kora-web
      # The container starts, serves the app with its security headers and a nonce, and hides the actuator.
      - name: Smoke check
        run: |
          docker run -d --name web -p 8080:8080 kora-web:${{ github.sha }}
          for i in $(seq 1 20); do curl -fs http://localhost:8080/healthz && break; sleep 1; done
          curl -fsI http://localhost:8080/login | grep -i "^content-security-policy:.*script-src 'self';"
          curl -fs http://localhost:8080/login | grep -q 'ngcspnonce="[0-9a-f]\{32\}"'
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/actuator/health)" = 404
      # Trivy from its pinned image, as for the API: fails on critical vulnerabilities that have a fix.
      - name: Scan the image
        run: >
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock aquasec/trivy:0.74.0
          image --scanners vuln --timeout 20m --severity CRITICAL --ignore-unfixed --exit-code 1 --no-progress
          kora-web:${{ github.sha }}
