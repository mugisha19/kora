# CI for the Spring Boot API. Runs only when kora-api (or this workflow) changes,
# so web-only commits don't spend minutes on Maven.
name: api-ci

on:
  push:
    branches: ['**']
    tags: ['api-v*', 'v*']
    paths: ['kora-api/**', '.github/workflows/api-ci.yml']
  pull_request:
    paths: ['kora-api/**', '.github/workflows/api-ci.yml']

# A newer push to the same branch cancels the run that is now out of date.
concurrency:
  group: api-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    working-directory: kora-api

jobs:
  verify:
    name: Format, static checks, unit + integration tests, coverage
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
          cache-dependency-path: kora-api/pom.xml
      # Docker is preinstalled on ubuntu-latest, so Testcontainers integration tests run here;
      # with CI=true they fail rather than skip if Docker is ever missing.
      - run: ./mvnw -B -ntp verify
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: api-reports
          path: |
            kora-api/target/site/jacoco
            kora-api/target/surefire-reports
            kora-api/target/failsafe-reports
            kora-api/target/spring-modulith-docs
          if-no-files-found: ignore

  # The container image job is added in Phase 10 together with the Dockerfile (see kora-api/docs/adr/0003).
