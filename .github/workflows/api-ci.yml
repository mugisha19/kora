# CI for the Spring Boot API. Runs only when kora-api (or this workflow) changes,
# so web-only commits don't spend minutes on Maven.
name: api-ci

on:
  push:
    branches: ['**']
    tags: ['api-v*', 'v*']
    paths: ['kora-api/**', '.github/workflows/api-ci.yml']
  pull_request:
    paths: ['kora-api/**', '.github/workflows/api-ci.yml']

# A newer push to the same branch cancels the run that is now out of date.
concurrency:
  group: api-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    working-directory: kora-api

jobs:
  verify:
    name: Format, static checks, unit + integration tests, coverage
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
          cache-dependency-path: kora-api/pom.xml
      # Docker is preinstalled on ubuntu-latest, so Testcontainers integration tests run here;
      # with CI=true they fail rather than skip if Docker is ever missing.
      - run: ./mvnw -B -ntp verify
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: api-reports
          path: |
            kora-api/target/site/jacoco
            kora-api/target/surefire-reports
            kora-api/target/failsafe-reports
            kora-api/target/spring-modulith-docs
          if-no-files-found: ignore

  image:
    name: Container image and vulnerability scan
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: kora-api
          load: true
          tags: kora-api:${{ github.sha }}
          cache-from: type=gha,scope=kora-api
          cache-to: type=gha,mode=max,scope=kora-api
      # Trivy from its pinned image rather than a third-party action. It fails the build on critical vulnerabilities
      # that have a fix, in the JRE, the OS packages or any library in the image.
      - name: Scan the image
        run: >
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock aquasec/trivy:0.74.0
          image --scanners vuln --timeout 20m --severity CRITICAL --ignore-unfixed --exit-code 1 --no-progress
          kora-api:${{ github.sha }}
